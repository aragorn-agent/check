name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          agentapiai-check --version
          agentapiai-check probes

  package:
    name: Build and check the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/wheel-venv/bin/agentapiai-check --version
          /tmp/wheel-venv/bin/agentapiai-check probes --json > /tmp/probes.json
          python -c "import json;d=json.load(open('/tmp/probes.json'));assert d['summary']['count'] > 0"
